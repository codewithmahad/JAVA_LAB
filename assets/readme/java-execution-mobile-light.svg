<svg xmlns="http://www.w3.org/2000/svg" width="340" height="308" viewBox="0 0 340 308" role="img" aria-labelledby="title desc">
<title id="title">From Java source to the JVM</title>
<desc id="desc">The lab uses the standard Maven layout: Java source under src/main/java is compiled into class files under target/classes. The java launcher starts the JVM to load and execute the chosen program.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#59636e" /></marker></defs>
<rect x="4" y="4" width="332" height="80" rx="6" fill="#f6f0e8" stroke="#d7bda7" /><text x="20" y="28" font-size="13" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Source code</text><text x="20" y="52" font-size="18" fill="#974b25" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">.java</text><path d="M 30 85 v 23" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)" /><text x="45" y="104" font-size="12" fill="#59636e" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">javac</text><rect x="4" y="114" width="332" height="80" rx="6" fill="#edf4fa" stroke="#b7cfdf" /><text x="20" y="138" font-size="13" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Class files</text><text x="20" y="162" font-size="18" fill="#276795" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">.class · bytecode</text><path d="M 30 195 v 23" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)" /><text x="45" y="214" font-size="12" fill="#59636e" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">java</text><rect x="4" y="224" width="332" height="80" rx="6" fill="#f6f8fa" stroke="#d1d9e0" /><text x="20" y="248" font-size="13" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">JVM</text><text x="20" y="272" font-size="15" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400">Load and execute the program</text>
<text x="20" y="76" font-size="11" fill="#59636e" font-family="'Cascadia Mono', Consolas, monospace">src/main/java</text><text x="20" y="186" font-size="11" fill="#59636e" font-family="'Cascadia Mono', Consolas, monospace">target/classes</text></svg>
