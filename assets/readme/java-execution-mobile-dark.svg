<svg xmlns="http://www.w3.org/2000/svg" width="340" height="260" viewBox="0 0 340 260" role="img" aria-labelledby="title desc">
<title id="title">From Java source to the JVM</title>
<desc id="desc">Simplified explicit compilation: javac compiles .java source into .class bytecode. The java launcher starts the JVM to load and execute the program.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#9da7b3"/></marker></defs>
<rect x="4" y="4" width="332" height="64" rx="6" fill="#151b23" stroke="#3d4652"/><text x="20" y="28" font-size="13" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Source code</text><text x="20" y="52" font-size="18" fill="#f0ad83" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">.java</text><path d="M 30 69 v 23" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="45" y="88" font-size="12" fill="#9da7b3" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">javac</text><rect x="4" y="98" width="332" height="64" rx="6" fill="#151b23" stroke="#3d4652"/><text x="20" y="122" font-size="13" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Class files</text><text x="20" y="146" font-size="18" fill="#88b9e5" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">.class · bytecode</text><path d="M 30 163 v 23" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="45" y="182" font-size="12" fill="#9da7b3" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">java</text><rect x="4" y="192" width="332" height="64" rx="6" fill="#151b23" stroke="#3d4652"/><text x="20" y="216" font-size="13" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">JVM</text><text x="20" y="240" font-size="15" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400">Load and execute the program</text>
</svg>
