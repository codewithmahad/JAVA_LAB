<svg xmlns="http://www.w3.org/2000/svg" width="340" height="204" viewBox="0 0 340 204" role="img" aria-labelledby="title desc">
<title id="title">Write, compile, and run Java</title>
<desc id="desc">Write Java source under src/main/java. The compiler produces class files under target/classes. The java launcher starts the JVM to load the selected main class.</desc>
<g font-family="Segoe UI, Arial, sans-serif" fill="#e6edf3">
<text x="8" y="23" font-size="12" font-weight="600" fill="#f29111" letter-spacing="1">01</text>
<text x="40" y="23" font-size="19" font-weight="600">Write the source</text>
<text x="40" y="48" font-size="15" fill="#9da7b3" font-family="Consolas, monospace">src/main/java · .java</text>
<text x="8" y="87" font-size="12" font-weight="600" fill="#f29111" letter-spacing="1">02</text>
<text x="40" y="87" font-size="19" font-weight="600">Compile with javac</text>
<text x="40" y="112" font-size="15" fill="#9da7b3" font-family="Consolas, monospace">target/classes · .class</text>
<text x="8" y="151" font-size="12" font-weight="600" fill="#f29111" letter-spacing="1">03</text>
<text x="40" y="151" font-size="19" font-weight="600">Run with java</text>
<text x="40" y="176" font-size="15" fill="#9da7b3">Load the selected main class.</text>
<path d="M8 196H332" fill="none" stroke="#30363d"/>
</g></svg>
