<svg xmlns="http://www.w3.org/2000/svg" width="980" height="104" viewBox="0 0 980 104" role="img" aria-labelledby="title desc">
<title id="title">Write, compile, and run Java</title>
<desc id="desc">Write Java source under src/main/java. The compiler produces class files under target/classes. The java launcher starts the JVM to load the selected main class.</desc>
<g font-family="Segoe UI, Arial, sans-serif" fill="#e6edf3">
<text x="8" y="16" font-size="12" font-weight="600" fill="#f29111" letter-spacing="1.5">01</text>
<text x="8" y="46" font-size="23" font-weight="600">Write the source</text>
<text x="8" y="73" font-size="16" fill="#9da7b3" font-family="Consolas, monospace">src/main/java · .java</text>
<text x="340" y="16" font-size="12" font-weight="600" fill="#f29111" letter-spacing="1.5">02</text>
<text x="340" y="46" font-size="23" font-weight="600">Compile with javac</text>
<text x="340" y="73" font-size="16" fill="#9da7b3" font-family="Consolas, monospace">target/classes · .class</text>
<text x="675" y="16" font-size="12" font-weight="600" fill="#f29111" letter-spacing="1.5">03</text>
<text x="675" y="46" font-size="23" font-weight="600">Run with java</text>
<text x="675" y="73" font-size="16" fill="#9da7b3">Load the selected main class.</text>
<path d="M280 40H315M308 34L315 40L308 46M615 40H650M643 34L650 40L643 46" fill="none" stroke="#9da7b3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M8 96H972" fill="none" stroke="#30363d"/>
</g></svg>
