<svg xmlns="http://www.w3.org/2000/svg" width="760" height="110" viewBox="0 0 760 110" role="img" aria-labelledby="title desc">
<title id="title">From Java source to the JVM</title>
<desc id="desc">The lab uses the standard Maven layout: Java source under src/main/java is compiled into class files under target/classes. The java launcher starts the JVM to load and execute the chosen program.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#9da7b3" /></marker></defs>
<rect x="4" y="10" width="196" height="88" rx="6" fill="#211a15" stroke="#68462f" /><text x="20" y="37" font-size="13" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Source code</text><text x="20" y="70" font-size="19" fill="#f0ad83" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">.java</text><path d="M 214 60 h 55" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#arrow)" /><text x="223" y="44" font-size="12" fill="#9da7b3" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">javac</text><rect x="282" y="10" width="196" height="88" rx="6" fill="#14212c" stroke="#37566f" /><text x="298" y="37" font-size="13" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Class files / bytecode</text><text x="298" y="70" font-size="19" fill="#88b9e5" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">.class</text><path d="M 492 60 h 55" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#arrow)" /><text x="501" y="44" font-size="12" fill="#9da7b3" font-family="'Cascadia Mono', Consolas, monospace" font-weight="400">java</text><rect x="560" y="10" width="196" height="88" rx="6" fill="#151b23" stroke="#3d4652" /><text x="576" y="37" font-size="13" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">JVM</text><text x="576" y="70" font-size="16" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400">Load and execute</text>
<text x="20" y="89" font-size="11" fill="#9da7b3" font-family="'Cascadia Mono', Consolas, monospace">src/main/java</text><text x="298" y="89" font-size="11" fill="#9da7b3" font-family="'Cascadia Mono', Consolas, monospace">target/classes</text></svg>
